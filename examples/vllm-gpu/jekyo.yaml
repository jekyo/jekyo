# Port of a hand-written 120-line StatefulSet+Service+Ingress GPU deployment.
app: llm
services:
  vllm:
    image: vllm/vllm-openai:v0.6.4
    args:
      - --host=0.0.0.0
      - --port=5000
      - --model=hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
      - --max-model-len=8196
      - --quantization=awq_marlin
    port: 5000
    gpu:
      devices: "1"
    volumes:
      hf-cache: /root/.cache/huggingface
    http:
      domain: llm.jekyo.app
volumes:
  hf-cache:
    size: 40Gi
