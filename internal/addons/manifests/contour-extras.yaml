# JEKYO overlay for Contour: a default IngressClass so Ingresses without an
# explicit class are served, matching the behavior apps expect.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: contour
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: projectcontour.io/contour
